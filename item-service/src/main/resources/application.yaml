server:
  port: 8081
spring:
  application:
    name: item-service
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 192.168.137.128:8848
    sentinel:
      transport:
        dashboard: 192.168.137.128:8858
  rabbitmq:
    host: 192.168.137.128
    port: 5672
    virtual-host: /
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
  elasticsearch:
    uris: http://192.168.137.128:9200
logging:
  level:
    com.hmall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 黑马商城商品管理接口文档
    description: "黑马商城商品管理接口文档"
    email: zhanghuyi@itcast.cn
    concat: 虎哥
    url: https://www.itcast.cn
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.hmall.item.controller
seata:
  application-id: ${spring.application.name}
  tx-service-group: hmall-tx-group
  service:
    vgroup-mapping:
      hmall-tx-group: SEATA_GROUP
    grouplist:
      SEATA_GROUP: 192.168.137.128:8091
  registry:
    type: file
feign:
  sentinel:
    enabled: false
