server:
  port: 8081
spring:
  application:
    name: item-service
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 192.168.137.128:8848
    sentinel:
      transport:
        dashboard: 192.168.137.128:8858
logging:
  level:
    com.hmall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 黑马商城商品管理接口文档
    description: "黑马商城商品管理接口文档"
    email: zhanghuyi@itcast.cn
    concat: 虎哥
    url: https://www.itcast.cn
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.hmall.item.controller
nseata:
  application-id: ${spring.application.name}
  tx-service-group: hmall-tx-group
  service:
    vgroup-mapping:
      hmall-tx-group: SEATA_GROUP
    grouplist:
      SEATA_GROUP: 192.168.137.128:8091
  registry:
    type: nacos
    nacos:
      server-addr: 192.168.137.128:8848
      group: SEATA_GROUP
feign:
  sentinel:
    enabled: true
