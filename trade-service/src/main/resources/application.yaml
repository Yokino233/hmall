server:
  port: 8084
spring:
  datasource:
    url: jdbc:mysql://192.168.137.128:3306/hmall?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: trade-service
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 192.168.137.128:8848
    sentinel:
      transport:
        dashboard: 192.168.137.128:8858
  rabbitmq:
    host: 192.168.137.128
    port: 5672
    virtual-host: /
    username: guest
    password: guest
    publisher-confirm-type: correlated
    template:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 2000
seata:
  application-id: ${spring.application.name}
  tx-service-group: hmall-tx-group
  service:
    vgroup-mapping:
      hmall-tx-group: SEATA_GROUP
    grouplist:
      SEATA_GROUP: 192.168.137.128:8091
  registry:
    type: file
feign:
  sentinel:
    enabled: false
logging:
  level:
    com.hmall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
  file:
    path: "logs/${spring.application.name}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  type-enums-package: com.hmall.trade.domain.enums
